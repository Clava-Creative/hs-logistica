# Postgres para desenvolvimento local:  docker compose up -d
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment: { POSTGRES_USER: hs, POSTGRES_PASSWORD: hs, POSTGRES_DB: hs_cms }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
