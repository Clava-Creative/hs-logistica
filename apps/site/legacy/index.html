<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HS Logística e Armazenagem | Foz do Iguaçu</title>
<meta name="description" content="Armazém geral, transporte e carga e descarga na BR-277 em Foz do Iguaçu, a minutos do Paraguai e da Argentina.">
<meta name="theme-color" content="#0E234E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Página clara para quem cota frete de dia, no escritório. O azul-marinho da marca aparece em dois lugares só:
   o painel do mapa na abertura e a faixa de cotação no fim. O verde marca ação e destaque. */
:root{
  --ink:#0E234E; --accent:#67AA4B; --paper:#FFFFFF;
  --accent-deep:color-mix(in srgb,var(--accent) 70%,var(--ink));
  --tint:color-mix(in srgb,var(--ink) 4%,var(--paper));
  --muted:color-mix(in srgb,var(--ink) 68%,var(--paper));
  --line:color-mix(in srgb,var(--ink) 14%,var(--paper));
  --on-ink:#F2F5FA; --on-ink-muted:color-mix(in srgb,var(--ink) 35%,#fff);
  --ok:#1E7A4F; --bad:#B3261E;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --r-lg:16px;
  --ease:cubic-bezier(.16,1,.3,1);
  --gut:max(24px,env(safe-area-inset-left));
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-color:var(--ink) var(--tint)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased;caret-color:var(--accent-deep)}
::selection{background:var(--accent);color:var(--ink)}
a{color:inherit;text-underline-offset:.2em}
img,canvas{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:2px}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:var(--gut)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:clamp(30px,3.6vw,48px);line-height:1.06;font-weight:800;font-stretch:105%;letter-spacing:-.02em;max-width:20ch}
h3{font-size:22px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
p{margin:0}
.lead{font-size:19px;color:var(--muted);max-width:58ch}
section{padding-block:128px 112px}
.head{display:grid;gap:18px;margin-bottom:56px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:600 16px/1 var(--body);padding:17px 24px;border:2px solid var(--ink);border-radius:var(--r);text-decoration:none;cursor:pointer;transition:transform .25s var(--ease),background .2s,color .2s}
.btn svg{width:18px;height:18px;transition:transform .25s var(--ease)}
.btn:hover{transform:translateY(-2px)}.btn:hover svg{transform:translateX(4px)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn-line{background:transparent;color:inherit;border-color:currentColor}
.btn-sm{padding:11px 15px;font-size:14px}

.nav{display:flex;align-items:center;gap:32px;padding-block:18px}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none;margin-right:auto}
.logo img{height:44px;width:auto;display:block}
.logo span{font:700 15px/1.2 var(--display);letter-spacing:-.01em}
.logo small{display:block;font:400 13px/1.3 var(--body);color:var(--muted)}
.nav nav{display:flex;gap:28px}
.nav nav a,.portal-link{font-size:15px;text-decoration:none;background-image:linear-gradient(currentColor,currentColor);background-size:0 1.5px;background-position:0 100%;background-repeat:no-repeat;transition:background-size .3s var(--ease);padding-bottom:3px}
.nav nav a:hover,.portal-link:hover{background-size:100% 1.5px}
.portal-link{border:0;background-color:transparent;color:var(--muted);font-family:var(--body);cursor:pointer;display:inline-flex;gap:7px;align-items:center;padding-inline:0;min-height:44px}
.portal-link svg{width:15px;height:15px}
@media(max-width:900px){.nav nav{display:none}}
@media(max-width:520px){.logo span{display:none}.nav{gap:14px}.logo img{height:38px}}
@media(max-width:380px){.nav .portal-link{font-size:0;gap:0}.nav .portal-link svg{width:20px;height:20px}}

.hero{display:grid;grid-template-columns:minmax(var(--gut),1fr) minmax(0,640px) minmax(0,552px) minmax(var(--gut),1fr);align-items:stretch;padding-block:28px 0}
.hero-text{grid-column:2;padding:64px 56px 88px 0;display:grid;align-content:center;gap:28px}
.hero h1{font-size:clamp(31px,5.3vw,78px);overflow-wrap:anywhere;line-height:.98;font-weight:900;font-stretch:108%;letter-spacing:-.035em}
.hero h1 .hl{color:var(--accent-deep);display:block}
.hero .sub{font-size:20px;color:var(--muted);max-width:46ch}
.cta{display:flex;flex-wrap:wrap;gap:14px}
.fact{font-size:15px;display:flex;flex-wrap:wrap;gap:8px 22px;padding-top:20px;border-top:1px solid var(--line)}
.fact b{font-weight:600}
.panel{grid-column:3/5;background:var(--ink);border-radius:var(--r-lg) 0 0 var(--r-lg);position:relative;overflow:hidden;min-height:600px}
.panel canvas{position:absolute;inset:0;width:100%;height:100%}
.panel img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media(max-width:940px){
  .hero{grid-template-columns:var(--gut) minmax(0,1fr) var(--gut)}
  .hero-text{padding:40px 0 48px}
  .panel{grid-column:1/-1;border-radius:0;min-height:0;aspect-ratio:1/1;max-height:560px;width:100%}
}
@media(prefers-reduced-motion:no-preference){
  body:not(.entered) .panel{animation:open 1.1s var(--ease) backwards}
  body:not(.entered) .hero-text>*{animation:rise .9s var(--ease) backwards}
  body:not(.entered) .hero-text>*:nth-child(2){animation-delay:.08s}
  body:not(.entered) .hero-text>*:nth-child(3){animation-delay:.16s}
  body:not(.entered) .hero-text>*:nth-child(4){animation-delay:.24s}
}
@keyframes open{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0)}}
@keyframes rise{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

.svc-layout{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:72px;align-items:start}
.svc-layout .head{position:sticky;top:32px;margin:0}
.rows{border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px 24px;align-items:center;padding:26px 0;border-bottom:1px solid var(--line);position:relative}
.row p{color:var(--muted);grid-column:1;max-width:52ch}
.row .go{grid-row:1/3;grid-column:2;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);color:var(--ink);transition:background .2s,border-color .2s,transform .3s var(--ease)}
.row .go svg{width:18px;height:18px}
.row:hover .go{background:var(--accent);border-color:var(--accent);transform:translateX(4px)}
@media(max-width:900px){.svc-layout{grid-template-columns:1fr;gap:40px}.svc-layout .head{position:static}}

.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;padding-bottom:112px}
.photo{position:relative;aspect-ratio:4/3;border-radius:var(--r-lg);overflow:hidden;background:var(--tint)}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
.photo:hover img{transform:scale(1.03)}
.slot{display:grid;place-content:center;gap:10px;text-align:center;border:2px dashed var(--line);color:var(--muted);font-size:15px;padding:20px}
.photo-tools{position:absolute;inset:auto 10px 10px auto;display:flex;gap:6px}

.where{background:var(--tint)}
.km{position:relative;height:74px;margin:8px 0 64px}
.km::before{content:"";position:absolute;inset:36px 0 auto;height:3px;background:var(--ink)}
.km span{position:absolute;top:0;transform:translateX(-50%);font:500 12.5px/1 var(--mono);white-space:nowrap;color:var(--muted)}
.km span::after{content:"";position:absolute;left:50%;top:30px;width:2px;height:15px;background:var(--ink)}
.km span:first-child{transform:none}.km span:first-child::after{left:0}
.km span.end{transform:translateX(-100%);color:var(--ink)}
.km span.end::after{left:auto;right:0;background:var(--accent);width:17px;height:17px;top:29px;border-radius:50%;box-shadow:0 0 0 4px var(--tint)}
.km i{position:absolute;top:56px;font:400 12px/1 var(--mono);font-style:normal;color:var(--muted)}
@media(max-width:700px){.km span.mid{display:none}}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:40px 56px}
.route{display:grid;gap:10px;position:relative;align-content:start}
.route p{color:var(--muted)}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:40px 32px;counter-reset:s;list-style:none;padding:0;margin:0}
.step{counter-increment:s;display:grid;gap:10px;position:relative;align-content:start}
.step::before{content:counter(s);font:900 64px/1 var(--display);font-stretch:108%;color:var(--accent-deep);letter-spacing:-.03em}
.step p{color:var(--muted)}

.about{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:72px;align-items:start}
.about .txt{display:grid;gap:22px}
.about .txt .lead{white-space:pre-line}
.facts{margin:0;border-top:2px solid var(--ink)}
.facts div{display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--line);font-size:16px;position:relative}
.facts .k{color:var(--muted);font-size:14px;padding-top:2px}
@media(max-width:900px){.about{grid-template-columns:1fr;gap:40px}}

.faq{max-width:840px;border-top:2px solid var(--ink)}
.qa{border-bottom:1px solid var(--line);position:relative}
.qa summary{list-style:none;cursor:pointer;padding:24px 56px 24px 0;position:relative}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"";position:absolute;right:12px;top:50%;width:12px;height:12px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-70%) rotate(45deg);transition:transform .3s var(--ease)}
.qa[open] summary::after{transform:translateY(-30%) rotate(225deg)}
.qa p{color:var(--muted);padding:0 56px 26px 0;max-width:68ch}

.close{background:var(--ink);color:var(--on-ink)}
.close .lead,.close .k{color:var(--on-ink-muted)}
.cgrid{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:72px;align-items:start}
@media(max-width:900px){.cgrid{grid-template-columns:1fr;gap:48px}}
.info{display:grid;margin:40px 0 0;border-top:1px solid color-mix(in srgb,var(--on-ink) 25%,transparent)}
.info .rowi{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:15px 0;border-bottom:1px solid color-mix(in srgb,var(--on-ink) 25%,transparent)}
.info .k{font-size:14px;padding-top:2px}
form.quote{display:grid;gap:18px;background:var(--paper);color:var(--ink);padding:36px;border-radius:var(--r-lg);box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
@media(max-width:520px){form.quote{padding:24px}}
label{display:grid;gap:7px;font:500 14px/1.3 var(--body);color:var(--ink)}
input,textarea,select{font:400 16px/1.4 var(--body);color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:13px 14px;width:100%;transition:border-color .2s}
input:hover,textarea:hover,select:hover{border-color:var(--muted)}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{min-height:112px;resize:vertical}
.err{color:var(--bad);font-size:13.5px;font-weight:400}
.msg{font-size:15px;font-weight:500}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}

footer{background:var(--ink);color:var(--on-ink-muted);font-size:14px;border-top:1px solid color-mix(in srgb,var(--on-ink) 18%,transparent)}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 32px;justify-content:space-between;align-items:center;padding-block:20px}
footer .portal-link{color:inherit;font-size:14px}

body.admin{padding-bottom:76px}
body.admin [data-p]{outline:1px dashed color-mix(in srgb,var(--accent) 80%,transparent);outline-offset:3px;cursor:text;min-width:24px;border-radius:2px}
body.admin [data-p]:hover{background:color-mix(in srgb,var(--accent) 20%,transparent)}
body.admin [data-p]:focus{outline:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
body.admin [data-p]:empty::before{content:attr(data-ph);opacity:.55}
.x,.add{display:none}
body.admin .x{display:grid;place-items:center;position:absolute;top:4px;right:-6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--bad);color:#fff;font:700 15px/1 var(--body);cursor:pointer;z-index:2}
body.admin .add{display:inline-flex;margin-top:24px;font:500 14px/1 var(--body);padding:12px 16px;border:1.5px dashed currentColor;background:none;color:inherit;border-radius:var(--r);cursor:pointer}
.bar{position:fixed;inset:auto 0 0;z-index:40;background:#0b0f18;color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px var(--gut);font-size:14px}
.bar .tip{margin-right:auto;display:flex;gap:10px;align-items:center}
.bar .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.bar button,.tool{font:500 13px/1 var(--body);color:#fff;background:#1c2230;border:1px solid #3a4253;border-radius:var(--r);padding:10px 13px;cursor:pointer}
.bar button:hover,.tool:hover{border-color:var(--accent)}
.bar .badge{background:var(--accent);color:#0b0f18;border-radius:10px;padding:1px 7px;margin-left:6px;font-weight:700}
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 70%,transparent);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--paper);color:var(--ink);width:min(430px,100%);padding:36px;border-radius:var(--r-lg);display:grid;gap:18px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.modal h2{font-size:28px}
.modal p,.drawer p{font-size:14.5px;color:var(--muted)}
.drawer{position:fixed;inset:0 0 0 auto;width:min(460px,100%);background:var(--paper);color:var(--ink);z-index:45;box-shadow:-30px 0 60px -20px rgba(0,0,0,.35);padding:30px 28px 110px;overflow:auto;display:grid;gap:18px;align-content:start}
.drawer h2{font-size:26px}
.drawer .closex{position:absolute;top:18px;right:18px;background:none;border:0;font-size:26px;cursor:pointer;color:var(--ink)}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.swatches input[type=color]{padding:3px;height:46px}
.leadc{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:6px;font-size:14.5px;position:relative}
.leadc b{font-size:16px}.leadc time{font-size:12.5px;color:var(--muted)}
.leadc .x{display:grid;top:8px;right:8px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#0b0f18;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

<div id="app"></div>
<div id="ui"></div>
<div class="toast" id="toast" role="status"></div>

async function api(path,opt={}){

document.addEventListener('focusout',e=>{

});

document.addEventListener('click',e=>{
  const t=e.target;
  if(admin&&t.closest('#app')&&(t.closest('a')||t.closest('summary'))&&!t.closest('.x')) e.preventDefault();
  const svc=t.closest('[data-svc]'); if(svc&&!admin){ const s=document.getElementById('q-service'); if(s) s.selectedIndex=+svc.dataset.svc; }

document.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=e.target, d=Object.fromEntries(new FormData(f));
  if(f.id==='quote'){
    const out=document.getElementById('q-out'), en=document.getElementById('e-name'), ec=document.getElementById('e-contact');
    en.textContent=d.name.trim()?'':'Escreva seu nome ou o da empresa.';
    ec.textContent=d.contact.trim()?'':'Escreva um telefone ou e-mail para retorno.';
    out.textContent='';
    if(en.textContent||ec.textContent){ document.getElementById(en.textContent?'q-name':'q-contact').focus(); return }
    try{
      if(mode==='server') await api('leads',{method:'POST',body:JSON.stringify(d)});

    <button class="btn btn-line btn-sm" data-act="resetTheme">Voltar às cores da marca</button>`) },
  resetTheme(){ C.theme={...DEFAULT.theme}; applyTheme(); save(); ACT.look() },
  leads(){ drawer(`<h2>Pedidos de cotação</h2>${leads.length?leads.map(l=>`<div class="leadc">
      <button class="x" data-act="delLead" data-id="${esc(l.id)}" aria-label="Apagar pedido">×</button>
      <b>${esc(l.name)}</b><span>${esc(l.contact)}</span><span>${esc(l.service||'')}</span><span>${esc(l.message||'')}</span>
      <time>${new Date(l.at).toLocaleString('pt-BR')}</time></div>`).join(''):'<p>Nenhum pedido ainda. Os pedidos enviados pelo formulário do site aparecem aqui.</p>'}`) },
  async delLead(b){
    try{
      if(mode==='server') await api('leads/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});
      else LS.set('hs_leads',(LS.get('hs_leads')||[]).filter(l=>String(l.id)!==b.dataset.id));
      await loadLeads(); ACT.leads();
    }catch(e){toast(e.message)}
  },
  backup(){ drawer(`<h2>Backup</h2><p>Copie o texto abaixo para guardar todo o conteúdo do site. Para restaurar, cole um backup e clique em Restaurar.</p>
    <label for="bk">Conteúdo do site<textarea id="bk" style="min-height:260px;font:12px var(--mono)">${esc(JSON.stringify(C,null,1))}</textarea></label>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" data-act="copyBk">Copiar backup</button><button class="btn btn-line btn-sm" data-act="restoreBk">Restaurar backup</button><button class="btn btn-line btn-sm" data-act="askReset">Voltar ao conteúdo original</button></div><p class="msg" id="bk-out"></p>`) },
  async copyBk(){ const t=document.getElementById('bk'); try{await navigator.clipboard.writeText(t.value);toast('Backup copiado')}catch{t.select()} },
  restoreBk(){ try{ C=merge(DEFAULT,JSON.parse(document.getElementById('bk').value)); logoImg=null; save(); closeUI(); render(); }catch{ const o=document.getElementById('bk-out'); o.className='msg bad'; o.textContent='Este texto não é um backup válido. Cole o backup inteiro, sem cortar.' } },
  askReset(b){ if(b.dataset.sure){ C=merge(DEFAULT,{}); logoImg=null; save(); closeUI(); render(); } else { b.dataset.sure=1; b.textContent='Clique de novo para confirmar'; } },
  pass(){ drawer(`<h2>Senha do portal</h2><form id="pass" style="display:grid;gap:14px">
    <label for="p-old">Senha atual<input id="p-old" name="old" type="password" required autocomplete="current-password"></label>
    <label for="p-new">Nova senha (mínimo 8 caracteres)<input id="p-new" name="neu" type="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn btn-primary btn-sm" type="submit">Trocar senha</button><p class="msg" id="p-out"></p></form>`) }
};
async function changePass(d){
  const o=document.getElementById('p-out');
  try{
    if(d.neu.length<8) throw new Error('A nova senha precisa de pelo menos 8 caracteres.');
    if(mode==='server') await api('password',{method:'POST',body:JSON.stringify({old:d.old,neu:d.neu})});
    else { if(d.old!==(LS.get('hs_pass')||'hs2013')) throw new Error('A senha atual não confere.'); LS.set('hs_pass',d.neu); }
    o.className='msg ok'; o.textContent='Senha alterada.';
  }catch(e){ o.className='msg bad'; o.textContent=e.message }
}

/* Mapa vivo da Tríplice Fronteira */
let raf, logoImg=null;
function startMap(){
  cancelAnimationFrame(raf);
  const cv=document.getElementById('map'); if(!cv) return;
  if(!logoImg){ logoImg=new Image(); logoImg.src=logo(); }
  const ctx=cv.getContext('2d'), still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FOZ=[.52,.50], CDE=[.16,.47], PIG=[.47,.86], HS=[.72,.36], OUT=[1.04,.20];
  const routes=[[CDE,[.33,.485],FOZ,HS],[PIG,[.50,.70],FOZ,HS],[OUT,HS]];
  const along=(pts,t)=>{ const L=[];let tot=0; for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);L.push(d);tot+=d}
    let d=t*tot; for(let i=0;i<L.length;i++){ if(d<=L[i]){const k=d/L[i];return [pts[i][0]+(pts[i+1][0]-pts[i][0])*k,pts[i][1]+(pts[i+1][1]-pts[i][1])*k]} d-=L[i] } return pts[pts.length-1] };
  function frame(ms){
    const r=cv.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2), W=r.width, H=r.height, U=Math.min(W,H);
    if(!W){ raf=requestAnimationFrame(frame); return }
    if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    const P=p=>[p[0]*W,p[1]*H], acc=C.theme.accent, t=ms/1000;
    ctx.strokeStyle='rgba(140,190,235,.26)'; ctx.lineCap='round';
    ctx.lineWidth=U*.034; ctx.beginPath(); ctx.moveTo(.38*W,-20); ctx.bezierCurveTo(.27*W,.3*H,.40*W,.55*H,.31*W,.78*H); ctx.bezierCurveTo(.28*W,.88*H,.25*W,.95*H,.23*W,H+20); ctx.stroke();
    ctx.lineWidth=U*.024; ctx.beginPath(); ctx.moveTo(W+20,.62*H); ctx.bezierCurveTo(.8*W,.78*H,.58*W,.68*H,.31*W,.78*H); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.12)'; ctx.font=`800 ${U*.058}px Archivo, Arial, sans-serif`; ctx.textAlign='left';
    ctx.fillText('PARAGUAI',.04*W,.16*H); ctx.fillText('BRASIL',.60*W,.10*H); ctx.fillText('ARGENTINA',.52*W,.95*H);
    routes.forEach((rt,i)=>{ ctx.strokeStyle=i===2?acc:'rgba(255,255,255,.5)'; ctx.lineWidth=i===2?3.5:1.5; ctx.setLineDash(i===2?[]:[5,7]);
      ctx.beginPath(); rt.forEach((p,j)=>{const q=P(p); j?ctx.lineTo(...q):ctx.moveTo(...q)}); ctx.stroke(); });
    ctx.setLineDash([]);
    routes.forEach((rt,i)=>{ for(let k=0;k<3;k++){ const u=still?(k+.5)/3:((t*.06*(1+i*.2)+k/3)%1); const q=P(along(rt,i===2?1-u:u));
      ctx.fillStyle=acc; ctx.beginPath(); ctx.roundRect(q[0]-5,q[1]-3.5,10,7,2); ctx.fill(); } });
    ctx.font=`500 ${Math.max(11,U*.026)}px "IBM Plex Sans", sans-serif`;
    [[FOZ,'Foz do Iguaçu',12,22],[CDE,'Ciudad del Este',-10,-16],[PIG,'Puerto Iguazú',14,5]].forEach(([p,n,dx,dy])=>{ const q=P(p);
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(q[0],q[1],5,0,7); ctx.fill(); ctx.fillStyle='rgba(242,245,250,.9)'; ctx.fillText(n,q[0]+dx,q[1]+dy) });
    ctx.fillStyle=acc; ctx.textAlign='right'; ctx.fillText('BR-277 para Paranaguá',.96*W,.20*H-26); ctx.textAlign='left';
    const h=P(HS), pulse=still?0:(t%2.4)/2.4, tw=U*.2, th=tw*.62;
    ctx.strokeStyle=acc; ctx.globalAlpha=1-pulse; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(h[0],h[1],tw*.5+pulse*34,0,7); ctx.stroke(); ctx.globalAlpha=1;
    ctx.fillStyle='#fff'; ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=24; ctx.shadowOffsetY=10;
    ctx.beginPath(); ctx.roundRect(h[0]-tw/2,h[1]-th/2,tw,th,10); ctx.fill(); ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
    if(logoImg.complete&&logoImg.naturalWidth){ const iw=tw*.78, ih=iw*logoImg.naturalHeight/logoImg.naturalWidth; ctx.drawImage(logoImg,h[0]-iw/2,h[1]-ih/2,iw,ih); }
    if(!still) raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  if(still){ logoImg.onload=()=>requestAnimationFrame(frame); (document.fonts?.ready||Promise.resolve()).then(()=>requestAnimationFrame(frame)); }
}
addEventListener('resize',()=>{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) startMap() });

(async()=>{
  await load();
  try{ const tk=sessionStorage.getItem('hs_tok'); if(tk&&mode==='server'){ token=tk; await api('leads').then(j=>{leads=j.leads;admin=true}).catch(()=>{token=null}) } }catch{}
  render();
  if(location.hash==='#portal'&&!admin) loginModal();
})();
</script>
